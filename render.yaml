services:
  - type: web
    name: maimai-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SEGA_ID
        sync: false
      - key: PASSWORD
        sync: false
